name: Update stats badge

on:
  schedule:
    # Off-the-hour minute: GitHub queues :00 crons hardest, so they drift most.
    - cron: "17 5,17 * * *"
  workflow_dispatch:      # lets you trigger a run by hand from the Actions tab
  push:
    paths:
      - "scripts/generate_badge.py"
      - ".github/workflows/update-badge.yml"

# The default token is read-only in most repos; the job needs to push.
permissions:
  contents: write

# A slow run must never race the next scheduled one into the same branch.
concurrency:
  group: update-stats-badge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_badge.py

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(badge): refresh stats [skip ci]"
          git push
