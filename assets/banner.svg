      <rect x="270" y="182" width="300" height="3" fill="url(#rule)" rx="1.5"/>
      <text x="270" y="214" fill="#8fd96a" font-size="19">German  ·  5,381 XP</text>
    </g>

    <g transform="translate(838 0)"><rect x="0" y="0.0" width="62" height="80.0" fill="#000000" opacity="0.7"/><rect x="0" y="80.0" width="62" height="80.0" fill="#dd0000" opacity="0.7"/><rect x="0" y="160.0" width="62" height="80.0" fill="#ffce00" opacity="0.7"/></g>
    

    <rect x="0.75" y="0.75" width="898.5" height="238.5" rx="18"
          fill="none" stroke="#58cc02" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
